name: Publish The Kingdom Villa
on:
  push:
    branches: [release-kingdom-villa]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild zips
        run: |
          cat parts/TheKingdomVilla-1.0.0-Mac-Intel.zip.part* > TheKingdomVilla-1.0.0-Mac-Intel.zip
          cat parts/TheKingdomVilla-1.0.0-Windows-x64.zip.part* > TheKingdomVilla-1.0.0-Windows-x64.zip
          sha256sum *.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete kingdom-villa-v1.0.0 -y --cleanup-tag || true
          gh release create kingdom-villa-v1.0.0 TheKingdomVilla-1.0.0-Mac-Intel.zip TheKingdomVilla-1.0.0-Windows-x64.zip \
            --target release-kingdom-villa \
            --title "The Kingdom Villa 1.0.0 (Mac e Windows)" \
            --notes "The Kingdom Villa 1.0.0. Um projeto desenvolvido por VillaChurch. © 2026 W. Carolino — CNPJ 69.610.819/0001-77. Mac: macOS 10.15+ Intel (na primeira abertura, botão direito > Abrir). Windows: 10/11 64 bits." \
            --latest=false
